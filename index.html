<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #eef2f7;
      color: #172033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100% - 32px, 340px);
      padding: 20px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(23 32 51 / 14%);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      text-align: center;
    }

    .display {
      width: 100%;
      min-height: 76px;
      margin-bottom: 14px;
      padding: 16px;
      overflow: hidden;
      border: 0;
      border-radius: 12px;
      background: #f3f6fb;
      color: inherit;
      font: 500 2rem/1.2 inherit;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      background: #e9eef6;
      color: #172033;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover {
      background: #dce5f1;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 3px solid #6c63ff;
      outline-offset: 2px;
    }

    .operator {
      background: #e4e2ff;
      color: #453dcc;
    }

    .operator:hover {
      background: #d6d3ff;
    }

    .equals {
      grid-column: span 2;
      background: #6258e8;
      color: #fff;
    }

    .equals:hover {
      background: #5147d4;
    }

    .clear {
      background: #ffe8e8;
      color: #b42332;
    }

    .clear:hover {
      background: #ffd9dc;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Simple Calculator</h1>
    <output class="display" id="display" aria-live="polite">0</output>
    <div class="keys">
      <button class="clear" data-action="clear" aria-label="Clear">AC</button>
      <button class="operator" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-value="/" aria-label="Divide">÷</button>
      <button class="operator" data-value="*" aria-label="Multiply">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-" aria-label="Subtract">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+" aria-label="Add">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="calculate">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const keys = document.querySelector(".keys");
    let expression = "";
    let justCalculated = false;

    function updateDisplay(value = expression) {
      display.textContent = value || "0";
    }

    function addToExpression(value) {
      const operators = "+-*/";

      if (/\d/.test(value)) {
        if (justCalculated) expression = "";
        expression += value;
        justCalculated = false;
      } else if (value === ".") {
        if (justCalculated) expression = "";
        const currentNumber = expression.split(/[+*/-]/).pop();
        if (!currentNumber.includes(".")) expression += currentNumber ? "." : "0.";
        justCalculated = false;
      } else if (operators.includes(value)) {
        if (!expression && value !== "-") return;
        if (operators.includes(expression.at(-1))) {
          expression = expression.slice(0, -1) + value;
        } else {
          expression += value;
        }
        justCalculated = false;
      }

      updateDisplay();
    }

    function calculate() {
      if (!expression || /[+*/.-]$/.test(expression)) return;

      // Only allow calculator digits, decimal points, and arithmetic operators.
      if (!/^[\d.+*/-]+$/.test(expression)) return;

      try {
        const result = Function(`"use strict"; return (${expression})`)();
        if (!Number.isFinite(result)) throw new Error("Invalid result");
        expression = String(Number(result.toPrecision(12)));
        justCalculated = true;
        updateDisplay(expression);
      } catch {
        expression = "";
        justCalculated = false;
        updateDisplay("Error");
      }
    }

    function handleAction(action) {
      if (action === "clear") {
        expression = "";
        justCalculated = false;
        updateDisplay();
      } else if (action === "delete") {
        if (!justCalculated) expression = expression.slice(0, -1);
        justCalculated = false;
        updateDisplay();
      } else if (action === "calculate") {
        calculate();
      }
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.action) handleAction(button.dataset.action);
      else addToExpression(button.dataset.value);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[\d.+*/-]$/.test(event.key)) addToExpression(event.key);
      else if (event.key === "Enter" || event.key === "=") calculate();
      else if (event.key === "Backspace") handleAction("delete");
      else if (event.key === "Escape") handleAction("clear");
      else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
